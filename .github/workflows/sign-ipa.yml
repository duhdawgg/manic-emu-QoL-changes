name: Sign IPA

# Signs an IPA with your paid Apple Developer account and puts it on your install page
# (GitHub Pages). Open the page in Safari on your iPhone and tap Install. No computer needed.
# Setup steps: SIGNING.md.
#
# Run it from the Actions tab (Sign IPA > Run workflow). Leave the link empty to sign the
# newest Manic EMU build. Builds made with [build] are also signed automatically once the
# secrets are set.
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "IPA link (https). Empty = newest Manic EMU build"
        required: false
        default: ""
      bundle_id:
        description: "New bundle ID (optional, default: original ID + your team ID)"
        required: false
        default: ""
      kind:
        description: "Signing type"
        type: choice
        options: [development, adhoc]
        default: development
  workflow_call:
    inputs:
      ipa_url:
        type: string
        required: false
        default: ""
      bundle_id:
        type: string
        required: false
        default: ""
      kind:
        type: string
        required: false
        default: development
      release_tag:
        description: "Release in this repo whose .ipa to sign"
        type: string
        required: false
        default: ""
      skip_if_unconfigured:
        description: "Finish quietly when the signing secrets aren't set"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: read

# Two runs at once could each make a certificate; run one at a time.
concurrency:
  group: sign-ipa
  cancel-in-progress: false

env:
  ZSIGN_COMMIT: 9299685bab7ef99827e06e5dfda93af747386590  # zsign v1.1.3
  STATE_BRANCH: signing-state
  SITE_BRANCH: apps
  RELEASE_TAG: signed-apps

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check secrets
        id: secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DEVICE_UDID: ${{ secrets.DEVICE_UDID }}
          SKIP_OK: ${{ inputs.skip_if_unconfigured }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY DEVICE_UDID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            if [ "$SKIP_OK" = "true" ]; then
              echo "::notice::Signing skipped: secrets not set yet:$missing (see SIGNING.md)"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Missing repository secrets:$missing. See SIGNING.md."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Get the IPA
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_URL: ${{ inputs.ipa_url }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p in
          if [ -n "${IPA_URL:-}" ]; then
            case "$IPA_URL" in https://*) ;; *) echo "::error::The IPA link must start with https://"; exit 1;; esac
            curl -fL --retry 3 --max-filesize 4000000000 -o in/app.ipa -- "$IPA_URL"
          else
            if [ -z "${TAG:-}" ]; then
              TAG=$(gh release list --limit 100 --json tagName,createdAt \
                    --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | last | .tagName')
              [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "::error::No build-* release found. Give an IPA link instead."; exit 1; }
            fi
            echo "Signing the IPA from release $TAG"
            gh release download "$TAG" --pattern '*.ipa' --dir in
            mv in/*.ipa in/app.ipa
          fi
          ls -lh in/app.ipa
          unzip -l in/app.ipa | grep -qE ' Payload/[^/]+\.app/Info\.plist$' \
            || { echo "::error::That file isn't an IPA (no Payload/*.app/Info.plist inside)."; exit 1; }

      - name: Set up tools
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev zlib1g-dev pkg-config > /dev/null
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pyjwt==2.10.1 cryptography==44.0.0

      - name: Cache zsign
        if: steps.secrets.outputs.ready == 'true'
        id: zsign-cache
        uses: actions/cache@v4
        with:
          path: /tmp/zsign-bin
          key: zsign-${{ env.ZSIGN_COMMIT }}-ubuntu-24.04

      - name: Build zsign
        if: steps.secrets.outputs.ready == 'true' && steps.zsign-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init -q /tmp/zsign && cd /tmp/zsign
          git fetch -q --depth 1 https://github.com/zhlynn/zsign "$ZSIGN_COMMIT"
          git checkout -q FETCH_HEAD
          make -C build/linux -j"$(nproc)" VERSION=1.1.3 > /dev/null
          mkdir -p /tmp/zsign-bin && cp bin/zsign /tmp/zsign-bin/

      - name: Get certificate and profiles from Apple
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DEVICE_UDID: ${{ secrets.DEVICE_UDID }}
          NEW_BUNDLE_ID: ${{ inputs.bundle_id }}
          PROFILE_KIND: ${{ inputs.kind || 'development' }}
        run: |
          set -euo pipefail
          # The certificate's private key is kept (encrypted) on its own branch between runs.
          mkdir -p /tmp/state
          if git fetch -q --depth 1 origin "$STATE_BRANCH" 2>/dev/null; then
            git show FETCH_HEAD:state.bin > /tmp/state/state.bin 2>/dev/null || true
          fi
          cp /tmp/state/state.bin /tmp/state/before.bin 2>/dev/null || true
          /tmp/venv/bin/python Scripts/signer/prepare.py in/app.ipa /tmp/state/state.bin /tmp/sign

      - name: Save certificate
        if: always() && steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          [ -f /tmp/state/state.bin ] || exit 0
          if cmp -s /tmp/state/state.bin /tmp/state/before.bin 2>/dev/null; then exit 0; fi
          rm -rf /tmp/state-repo && mkdir /tmp/state-repo && cd /tmp/state-repo
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$STATE_BRANCH" && git checkout -q FETCH_HEAD -B "$STATE_BRANCH" \
            || git checkout -q --orphan "$STATE_BRANCH"
          cp /tmp/state/state.bin state.bin
          printf 'Encrypted signing certificate for the Sign IPA workflow. Only readable with the repo secrets.\n' > README.md
          git add state.bin README.md
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Update signing certificate" || exit 0
          git push -q origin "HEAD:$STATE_BRANCH"

      - name: Sign
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          BID=$(jq -r .bundle_id /tmp/sign/info.json)
          args=()
          for p in /tmp/sign/profiles/*.mobileprovision; do args+=(-m "$p"); done
          # -W drops a bundled Apple Watch app (it would need its own profiles).
          /tmp/zsign-bin/zsign -k /tmp/sign/key.pem -c /tmp/sign/cert.pem "${args[@]}" \
            -b "$BID" -W -x /tmp/sign/meta -z 9 -o out.ipa in/app.ipa
          ls -lh out.ipa
          # Check the result: right bundle ID, a profile inside, and a code signature.
          mkdir -p /tmp/check && unzip -q out.ipa -d /tmp/check
          APP=$(ls -d /tmp/check/Payload/*.app)
          /tmp/venv/bin/python - "$APP" "$BID" <<'PY'
          import plistlib, sys, os
          app, bid = sys.argv[1:]
          info = plistlib.load(open(os.path.join(app, "Info.plist"), "rb"))
          assert info["CFBundleIdentifier"] == bid, info["CFBundleIdentifier"]
          assert os.path.getsize(os.path.join(app, "embedded.mobileprovision")) > 0
          assert os.path.isfile(os.path.join(app, "_CodeSignature", "CodeResources"))
          print("Signed app looks right:", bid)
          PY
          rm -rf /tmp/sign/key.pem

      - name: Publish to the install page
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BID=$(jq -r .bundle_id /tmp/sign/info.json)
          FILE="${BID}-${GITHUB_RUN_NUMBER}.ipa"
          mv out.ipa "$FILE"

          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "true" ]; then
            echo "::warning::This repository is private, so your iPhone can't download the app. Make it public (Settings > General > Danger Zone > Change visibility), then run this again."
          fi

          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --title "Signed apps" \
              --notes "Signed IPAs for the install page. Install them from the page in Safari, not from here." \
              --target "${{ github.event.repository.default_branch }}"
          fi
          # Remove older copies of this app, then upload the new one.
          for old in $(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -F "${BID}-" | grep -E '^'"${BID//./\\.}"'-[0-9]+\.ipa$' || true); do
            gh release delete-asset "$RELEASE_TAG" "$old" -y
          done
          gh release upload "$RELEASE_TAG" "$FILE"
          IPA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${FILE}"

          SITE_URL=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          if [ -z "$SITE_URL" ]; then
            OWNER="${GITHUB_REPOSITORY%%/*}"
            SITE_URL="https://${OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo "::warning::GitHub Pages isn't turned on yet. Settings > Pages > Source: Deploy from a branch > Branch: ${SITE_BRANCH} / (root) > Save."
          fi

          ICON=$(ls /tmp/sign/meta/*.png 2>/dev/null | head -1 || true)
          rm -rf /tmp/site && mkdir /tmp/site && cd /tmp/site
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$SITE_BRANCH" && git checkout -q FETCH_HEAD -B "$SITE_BRANCH" \
            || git checkout -q --orphan "$SITE_BRANCH"
          /tmp/venv/bin/python "$GITHUB_WORKSPACE/Scripts/signer/publish.py" /tmp/sign/info.json \
            "$IPA_URL" "$SITE_URL" /tmp/site ${ICON:+"$ICON"}
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Signed $BID (run ${GITHUB_RUN_NUMBER})"
          for i in 1 2 3; do git push -q origin "HEAD:$SITE_BRANCH" && break; git pull -q --rebase origin "$SITE_BRANCH"; done

          {
            echo "## Signed: $(jq -r .name /tmp/sign/info.json)"
            echo "Open this page in **Safari** on your iPhone and tap **Install**: $SITE_URL"
            echo
            echo "Bundle ID: \`$BID\` · Signing: $(jq -r .kind /tmp/sign/info.json)"
            CAPS=$(jq -r '.capabilities_to_enable_by_hand | join(", ")' /tmp/sign/info.json)
            [ -z "$CAPS" ] || echo "Turn on by hand at developer.apple.com > Identifiers > $BID: $CAPS (then sign again)."
          } >> "$GITHUB_STEP_SUMMARY"
